# @package _global_
# Match the original predictor's 192 residual write coordinates at inference.
# Candidate attention, MLP and residual states still compute at width 384.
seed: 3072
loss:
  sigreg:
    weight: 0.1
model:
  predictor:
    hidden_dim: 384
    routing:
      enabled: true
      mode: learned
      shared_dim: 128
      group_size: 16
      top_k: 4
      router_hidden_dim: 128
      warmup_steps: 100
      balance_enabled: true
      balance_ema: 0.99
      balance_min_factor: 0.25
      balance_max_factor: 1.5
      bias_lr: 0.01
      bias_clip: 2.0
  routing_credit:
    enabled: true
    weight: 0.01
    interval: 8
    warmup_steps: 100
    min_margin: 1.0e-5
    relative_margin: 1.0e-3
